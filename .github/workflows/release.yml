name: Release

# Standard changesets flow, in a single job:
#   - Push to main WITH pending changesets -> opens/updates a "Version Packages"
#     PR that bumps versions and writes changelogs. Nothing is published.
#   - Push to main with NO pending changesets (i.e. you just merged that PR)
#     -> publishes the bumped packages to npm, creates + pushes git tags, and
#     creates a GitHub Release per package.
#
# So merging the "Version Packages" PR is your "release now" action. Pushes
# that have nothing new to publish are a no-op (pnpm skips already-published
# versions), so normal commits won't create spurious releases.
on:
  push:
    branches: [main]

concurrency: release-${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the version PR branch and git tags
      pull-requests: write  # open/update the "Version Packages" PR
      id-token: write       # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          # Required by changesets to compute tags and generate changelogs
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # NOTE: no npm token anywhere. Publishing authenticates via npm trusted
      # publishing (OIDC): each package on npmjs.com trusts this repo's
      # release.yml workflow, and pnpm (>= 10.14) exchanges the id-token for
      # publish credentials automatically. Provenance comes with it for free.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          # When changesets exist on main, opens/updates the version PR.
          version: pnpm release:version
          # When no changesets exist, publishes and tags (see release:publish).
          publish: pnpm release:publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"  # publish with npm provenance attestation
