name: Version

on:
  push:
    branches: [main]

concurrency: version-${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    name: Open or update version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the "Version Packages" PR branch
      pull-requests: write  # open/update the PR
    steps:
      - uses: actions/checkout@v4
        with:
          # Required by changesets to compute tags and generate changelogs
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Opens/updates a "Version Packages" PR that bumps versions and writes
      # changelogs from the pending changesets. Publishing is intentionally NOT
      # done here — it happens in release.yml when a GitHub Release is published.
      # If you don't want to release yet, just leave the PR open (or close it).
      - name: Create or update version PR
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
