name: Release

# Publishes to npm when a GitHub Release is published.
# Typical flow:
#   1. Merge changesets to main -> the Version workflow opens a "Version
#      Packages" PR that bumps versions and updates changelogs. (Decline/close
#      the PR if you're not ready to release.)
#   2. Merge that PR when a feature set is complete.
#   3. Create a GitHub Release whose tag matches the new version
#      (e.g. `gh release create v0.1.0`).
#   4. This workflow builds the bumped packages and publishes them to npm.
on:
  release:
    types: [published]

concurrency: release-${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the exact commit the release tag points at, so we publish
          # the versions that were merged from the "Version Packages" PR.
          ref: ${{ github.event.release.tag_name }}

      - uses: pnpm/action-setup@v4

      # NOTE: registry-url is intentionally omitted. Setting it makes setup-node
      # write an .npmrc that reads ${NODE_AUTH_TOKEN} and points npm at it via
      # NPM_CONFIG_USERCONFIG — which previously left the publish unauthenticated
      # (404). We configure auth explicitly below instead.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Configure npm auth
        run: pnpm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: pnpm release:publish
